name: Research manuscript reproducibility
on:
  push:
    branches:
      - paper/referee-revision-2026-10-19
  workflow_dispatch:

concurrency:
  group: research-manuscript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reproduce-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install python and LaTeX dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended poppler-utils
          python -m pip install -U pip
          python -m pip install -r requirements.txt scipy sympy joblib
      - name: EoS-group calibration smoke test
        run: python population/group_conformal.py
      - name: Independent damping-time empirical check
        run: python population/tau_consistency.py
      - name: Independently integrate two-component stellar backgrounds
        working-directory: population
        run: python twofluid_background.py
      - name: Check microphysics-anchored nuclear EoS families and dark shifts
        working-directory: population
        run: python microphysics_anchor.py 4
      - name: Verify previously validated full-interior causality audit
        working-directory: population
        run: |
          test "$(git hash-object results_causality_audit.json)" = "e41e11e32e93f28a96c35da9076e45550dff43a2"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results_causality_audit.json").read_text())
          p=d["groups"]["pop_data"]["per_class"]
          assert len(d["groups"]["pop_data"]["records"]) == 360
          assert [p[str(i)]["full_causal"] for i in range(4)] == [85,90,86,90]
          assert sum(p[str(i)]["noncausal_count"] for i in range(4)) == 9
          print("ARCHIVED_FULL_INTERIOR_CAUSALITY_AUDIT_VERIFIED")
          PY
      - name: Re-evaluate causal-only class-balanced sample
        working-directory: population
        run: python causal_filtered_classification.py
      - name: Evaluate joint causality and stable dark fermion mass window
        working-directory: population
        run: python joint_stability_classification.py
      - name: Generate joint-stability PDU results table
        run: python analysis/joint_stability_report.py
      - name: Generate fully causal primary results table figure and macros
        run: python analysis/causal_primary.py
      - name: Regenerate canonical manuscript and compile PDF
        working-directory: analysis
        run: |
          python build.py paper_final
          test -s paper_final.pdf
          pdfinfo paper_final.pdf | grep -E 'Pages:|File size:'
          test $(grep -c 'missing macros:' paper_final.log || true) -eq 0
      - name: Compile PDU-targeted manuscript and validate title and keywords
        working-directory: analysis
        run: |
          python build.py pdu_submission
          test -s pdu_submission.pdf
          pdfinfo pdu_submission.pdf | grep -E 'Pages:|File size:'
          pdftotext pdu_submission.pdf - | grep -F 'Identifiability Limits'
          pdftotext pdu_submission.pdf - | grep -F 'Keywords:'
          grep -F 'HusainOsc' pdu_submission.tex
          test $(grep -c '@@' pdu_submission.tex || true) -eq 0
      - name: Build standalone PDU LaTeX source bundle
        working-directory: analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          out = Path('../submission/pdu/pdu_latex_source.zip')
          paths = [Path('pdu_submission.tex')]
          paths += sorted(Path('figs').glob('*.pdf'))
          paths += sorted(Path('tables').glob('*.tex'))
          assert len(paths) > 12
          with ZipFile(out, 'w', ZIP_DEFLATED) as f:
              for p in paths:
                  assert p.exists() and p.stat().st_size > 0, p
                  f.write(p, p.as_posix())
          assert out.stat().st_size > 10000
          print('PDU source bundle:', out, out.stat().st_size, 'bytes,', len(paths), 'files')
          PY
      - name: Validate population manuscript claims
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('analysis/paper_final.tex').read_text()
          assert '@@' not in src
          assert 'finite-sample split-conformal guarantee' in src
          assert '938.783' in src
          assert 'Phys. Dark Universe' in src
          assert 'fully causality-audited EoSs' in src
          assert 'Carvalho24Hyp' in src
          assert 'Goncalves25' in src
          assert Path('analysis/tables/tab_joint_stability.tex').stat().st_size > 100
          assert '340' in src
          assert Path('analysis/figs/fig_causal_primary.pdf').stat().st_size > 1000
          assert '3\\times10^{-8}' in src
          print('Scientific manuscript source checks passed')
          PY
      - name: Group-aware class-conditional coverage for existing EoS
        working-directory: population
        run: |
          python run_group_calibration.py NICER+f20,SO@1.0 2 3
      - name: Commit reproducible PDF and validation outputs to review branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f population/results_joint_stability_classification.json analysis/tables/tab_joint_stability.tex analysis/results/macros_joint_stability.json analysis/pdu_submission.pdf analysis/pdu_submission.tex submission/pdu/pdu_latex_source.zip analysis/paper_final.pdf population/results_tau_consistency.json population/results_group_mondrian_summary.json population/results_group_mondrian.csv population/results_twofluid_background.json population/results_microphysics_anchor.json population/results_causality_audit.json population/results_causal_filtered_classification.json analysis/figs/fig_causal_primary.pdf analysis/tables/tab_causal_primary.tex analysis/results/macros_causal.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(paper): refresh compiled PDF and validated group coverage"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload paper and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-manuscript-and-evidence
          path: |
            analysis/paper_final.pdf
            analysis/pdu_submission.pdf
            population/results_joint_stability_classification.json
            analysis/tables/tab_joint_stability.tex
            analysis/results/macros_joint_stability.json
            analysis/pdu_submission.tex
            submission/pdu/pdu_latex_source.zip
            submission/pdu/cover_letter.md
            submission/pdu/highlights.txt
            submission/pdu/novelty_and_overlap_review.md
            submission/pdu/declarations_DRAFT.md
            analysis/paper_final.tex
            population/results_tau_consistency.json
            population/results_group_mondrian.csv
            population/results_group_mondrian_summary.json
            population/results_twofluid_background.json
            population/results_microphysics_anchor.json
            population/results_causality_audit.json
            population/results_causal_filtered_classification.json
            analysis/figs/fig_causal_primary.pdf
            analysis/tables/tab_causal_primary.tex
            analysis/results/macros_causal.json
          if-no-files-found: warn

