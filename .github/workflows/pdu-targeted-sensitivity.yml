name: PDU targeted final sensitivity
on:
  push:
    branches: [paper/pdu-final-referee-revision-2026-11-24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt scipy sympy joblib
      - name: Targeted prior and maximum-mass sensitivity
        working-directory: population
        run: python pdu_targeted_sensitivity.py
      - name: Record exact runtime environment
        run: python -m pip freeze > population/pdu_environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdu-targeted-sensitivity
          path: |
            population/results_pdu_targeted_sensitivity.json
            population/pdu_environment.txt
